
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenpack Gate Pass</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      color: #183b29;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0f4d2d, #1b6b3a);
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    main {
      max-width: 420px;
      margin: 45px auto;
      padding: 0 16px;
    }

    .login-box {
      background: white;
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 5px 22px #00000012;
    }

    h2 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #718078;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin: 17px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd8cf;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1b6b3a;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #1b6b3a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: not-allowed;
      opacity: 0.65;
    }

    .info {
      margin-top: 18px;
      padding: 12px;
      background: #e7f4eb;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #718078;
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>GREENPACK GATE PASS</h1>
    <p>GREENPACK INDUSTRIES</p>
  </header>

  <main>
    <section class="login-box">

      <h2>Employee Login</h2>

      <p class="subtitle">
        Gate Pass Application & Approval Portal
      </p>

      <form id="loginForm" onsubmit="login(event)">

  <label for="empId">HRMS Employee ID</label>
  <input
    type="text"
    id="empId"
    placeholder="Enter Employee ID"
    autocomplete="username"
    required
  >

  <label for="password">HRMS Password</label>
  <input
    type="password"
    id="password"
    placeholder="Enter HRMS Password"
    autocomplete="current-password"
    required
  >

  <button type="submit">
    LOGIN
  </button>

</form>

<p id="loginMessage" style="text-align:center;font-size:14px;"></p>

      <div class="info">
        Use your existing HRMS login credentials.<br>
        HRMS authentication connection will be added next.
      </div>

    </section>
  </main>

  <footer>
    GREENPACK INDUSTRIES | Gate Pass System
  </footer>

</body>
</html>
