
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenpack Gate Pass</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      color: #183b29;
    }
    header {
      background: linear-gradient(135deg, #0f4d2d, #1b6b3a);
      color: white;
      padding: 25px 18px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 0; font-size: 14px; }
    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 0 16px;
    }
    .panel {
      background: white;
      padding: 28px 22px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000010;
      text-align: center;
    }
    h2 { margin-top: 0; }
    .notice {
      background: #e7f4eb;
      padding: 15px;
      border-radius: 9px;
      line-height: 1.6;
      font-size: 14px;
    }
    footer {
      text-align: center;
      color: #66756b;
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>GREENPACK GATE PASS</h1>
    <p>GREENPACK INDUSTRIES</p>
  </header>

  <main>
    <section class="panel">
      <h2>Gate Pass Portal</h2>
      <p>Employee Gate Pass Application & Approval System</p>
      <div class="notice">
        Welcome to the Greenpack Gate Pass Portal.<br>
        Employee login and Gate Pass application will be added in the next step.
      </div>
    </section>
  </main>

  <footer>GREENPACK INDUSTRIES | Gate Pass System</footer>
</body>
</html>
